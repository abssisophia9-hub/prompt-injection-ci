name: prompt-injection-tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  models: read
jobs:
  attack-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}